<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Галерея стикеров</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Стили остаются без изменений */
    </style>
</head>
<body>
    <div class="header">
        <h1>🎨 Галерея стикеров</h1>
        <p class="subtitle">Выберите стикер для отправки в группу</p>
    </div>

    <!-- Поиск -->
    <input type="text" class="search-box" id="searchInput" placeholder="🔍 Поиск стикеров..." onkeyup="filterStickers()">

    <!-- Категории -->
    <div class="categories" id="categories"></div>

    <!-- Сетка стикеров -->
    <div id="stickers-container" class="stickers-grid"></div>

    <div class="footer">
        👆 Нажмите на стикер, чтобы отправить в группу
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;

        // Проверяем, что WebApp инициализирован
        console.log('Telegram WebApp initialized:', tg);
        console.log('Platform:', tg.platform);
        console.log('Version:', tg.version);

        // Разворачиваем на весь экран
        tg.expand();

        // Сообщаем, что WebApp готов
        tg.ready();

        // Отключаем подтверждение закрытия для удобства
        tg.disableClosingConfirmation();

        // Настраиваем тему
        tg.setHeaderColor('bg_color');
        tg.setBackgroundColor('bg_color');

        // ============ БАЗА ДАННЫХ СТИКЕРОВ ============
        // ВАЖНО: Замените эти file_id на реальные!
        const STICKERS_DATABASE = {
            "actions": {
                "name": "🏃 Действия",
                "icon": "🏃",
                "stickers": [
                    { "id": "test_sticker_1", "name": "Пить", "emoji": "🥤", "file_id": "CAACAgIAAxkBAAEM5gZm6NpAqVtWqVtWqVtWqQ" },
                    { "id": "test_sticker_2", "name": "Есть", "emoji": "🍽️", "file_id": "CAACAgIAAxkBAAEM5gZm6NpAqVtWqVtWqVtWqQ" },
                    { "id": "test_sticker_3", "name": "Бежать", "emoji": "🏃", "file_id": "CAACAgIAAxkBAAEM5gZm6NpAqVtWqVtWqVtWqQ" }
                ]
            },
            "food": {
                "name": "🍔 Еда",
                "icon": "🍔",
                "stickers": [
                    { "id": "test_sticker_4", "name": "Пицца", "emoji": "🍕", "file_id": "CAACAgIAAxkBAAEM5gZm6NpAqVtWqVtWqVtWqQ" },
                    { "id": "test_sticker_5", "name": "Бургер", "emoji": "🍔", "file_id": "CAACAgIAAxkBAAEM5gZm6NpAqVtWqVtWqVtWqQ" }
                ]
            }
        };

        // Состояние приложения
        let currentCategory = 'all';
        let searchQuery = '';

        // Инициализация
        function init() {
            console.log('Инициализация галереи...');
            renderCategories();
            renderStickers();

            // Показываем приветственное сообщение
            tg.showPopup({
                title: '🎨 Галерея стикеров',
                message: 'Нажмите на любой стикер, чтобы отправить его в группу!',
                buttons: [{type: 'ok'}]
            });
        }

        // Отображение категорий
        function renderCategories() {
            const categoriesContainer = document.getElementById('categories');

            let html = `<button class="category-btn ${currentCategory === 'all' ? 'active' : ''}"
                               onclick="selectCategory('all')">
                            🏠 Все (${getTotalStickersCount()})
                        </button>`;

            for (const [key, category] of Object.entries(STICKERS_DATABASE)) {
                const count = category.stickers.length;
                html += `<button class="category-btn ${currentCategory === key ? 'active' : ''}"
                                 onclick="selectCategory('${key}')">
                            ${category.icon || '📁'} ${category.name} (${count})
                        </button>`;
            }

            categoriesContainer.innerHTML = html;
        }

        // Получить общее количество стикеров
        function getTotalStickersCount() {
            let total = 0;
            for (const category of Object.values(STICKERS_DATABASE)) {
                total += category.stickers.length;
            }
            return total;
        }

        // Выбор категории
        window.selectCategory = function(category) {
            console.log('Выбрана категория:', category);
            currentCategory = category;
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            renderCategories();
            renderStickers();
        };

        // Фильтрация стикеров по поиску
        window.filterStickers = function() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderStickers();
        };

        // Отображение стикеров
        function renderStickers() {
            const container = document.getElementById('stickers-container');

            let stickers = [];

            if (currentCategory === 'all') {
                for (const [catKey, category] of Object.entries(STICKERS_DATABASE)) {
                    stickers = stickers.concat(category.stickers.map(s => ({
                        ...s,
                        category: category.name,
                        categoryKey: catKey
                    })));
                }
            } else {
                const category = STICKERS_DATABASE[currentCategory];
                if (category) {
                    stickers = category.stickers.map(s => ({
                        ...s,
                        category: category.name,
                        categoryKey: currentCategory
                    }));
                }
            }

            // Фильтрация по поиску
            if (searchQuery) {
                stickers = stickers.filter(s =>
                    s.name.toLowerCase().includes(searchQuery) ||
                    s.category.toLowerCase().includes(searchQuery)
                );
            }

            if (stickers.length === 0) {
                container.innerHTML = '<div class="empty-state">😕 Стикеры не найдены</div>';
                return;
            }

            let html = '';
            stickers.forEach(sticker => {
                html += `
                    <div class="sticker-card" onclick="selectSticker('${sticker.file_id}', '${sticker.name}', '${sticker.category}')">
                        <div class="sticker-emoji">${sticker.emoji || '🖼️'}</div>
                        <div class="sticker-name">${sticker.name}</div>
                        <div class="sticker-category">${sticker.category}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Выбор стикера - ИСПРАВЛЕНО!
        window.selectSticker = function(fileId, stickerName, category) {
            console.log('Выбран стикер:', {fileId, stickerName, category});

            if (!fileId) {
                console.error('Нет file_id стикера!');
                tg.showAlert('❌ Ошибка: не найден ID стикера');
                return;
            }

            // Формируем данные для отправки
            const data = JSON.stringify({
                sticker_id: fileId,
                name: stickerName,
                category: category
            });

            console.log('Отправляем данные в бота:', data);

            // ОТПРАВЛЯЕМ ДАННЫЕ В БОТА!
            try {
                tg.sendData(data);
                console.log('✅ Данные отправлены!');

                // Показываем уведомление
                tg.showAlert(`✅ Стикер "${stickerName}" отправляется в группу!`);

                // Закрываем WebApp
                setTimeout(() => {
                    tg.close();
                }, 1000);
            } catch (error) {
                console.error('❌ Ошибка отправки:', error);
                tg.showAlert('❌ Ошибка при отправке стикера');
            }
        };

        // Запускаем приложение после загрузки страницы
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
